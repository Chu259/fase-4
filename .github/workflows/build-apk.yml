name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Organizar estructura de proyecto
        run: |
          mkdir -p src
          # Mueve los archivos de componentes dentro de src si quedaron sueltos
          [ -f App.tsx ] && mv *.tsx src/ 2>/dev/null || true
          [ -f App.css ] && mv *.css src/ 2>/dev/null || true
          # Mantiene main.tsx accesible
          if [ -f src/main.tsx ]; then echo "Estructura ok"; fi

      - name: Instalar dependencias y compilar
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Capturador-Gerencia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
